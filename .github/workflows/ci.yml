name: CI

# Pushes to main and tags run this through release.yml, before the image is published.
on:
  pull_request:
  workflow_call:
    inputs:
      all:
        description: Run every project instead of only the affected ones (for releases).
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    # The server's tests run against a real Postgres: row-level security is what keeps teams
    # apart, and it can't be faked.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openversion
          POSTGRES_PASSWORD: openversion
          POSTGRES_DB: openversion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openversion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://openversion:openversion@localhost:5432/openversion_test
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci
      - uses: nrwl/nx-set-shas@v4
        if: ${{ !inputs.all }}

      - run: npx nx affected -t lint stylelint typecheck test build
        if: ${{ !inputs.all }}
      - run: npx nx run-many -t lint stylelint typecheck test build
        if: ${{ inputs.all }}
